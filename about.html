<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Hello, world!</h1>
    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar w/ text</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                </ul>
                <span class="navbar-text">
                    Navbar text with an inline element
                </span>
            </div>
        </div>
    </nav>
    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="true">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/HG DILAZA.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="img/HG SCHWARZTTE.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="img/TICKBALANG.png" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <img src="img/HG SCHWARZTTE.png" alt="" class="img-fluid">
            </div>
            <div class="col-12 col-md-6 col-lg-8 col-xl-3">
                <h2>HG 戰騎鋼彈 SCHWARZTTE</h2>
                <p>1/144 HG機動戰士鋼彈 水星的魔女</p>
                <p>2023年7月8日發售</p>
                <p>官方定價日幣 2,090 日圓</p>
            </div>
            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <img src="img/TICKBALANG.png" alt="" class="img-fluid">
            </div>
            <div class="col-12 col-md-6 col-lg-8 col-xl-3">
                <h2>HG 提克巴蘭/狄克巴蘭 TICKBALANG</h2>
                <p>1/144 HG機動戰士鋼彈 水星的魔女</p>
                <p>2023年2月8日發售</p>
                <p>官方定價日幣 1,430 日圓</p>
            </div>

                    <script src="js/bootstrap.min.js"></script>
</body>

</html>
